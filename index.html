<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Perfect Host</title>
  <meta name="theme-color" content="#0e6860" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Perfect Host" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <style>
    :root {
      --ink: #17211f;
      --muted: #65706c;
      --panel: rgba(255, 250, 242, 0.94);
      --line: rgba(38, 31, 23, 0.15);
      --brand: #0e6860;
      --red: #c64141;
      --shadow: 0 16px 40px rgba(28, 22, 16, 0.18);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #dbc099;
      color: var(--ink);
      font-family: Inter, "SF Pro Display", "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
      user-select: none;
    }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; }

    .app {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #d8bb91;
    }

    .map-viewport {
      position: absolute;
      inset: 0;
      overflow: auto;
      touch-action: pan-x pan-y;
      background: #d8bb91;
    }

    .map-scale {
      width: calc(960px * var(--zoom, 1));
      height: calc(650px * var(--zoom, 1));
      position: relative;
      transform-origin: 0 0;
      margin: var(--map-y, 0px) var(--map-x, 0px);
    }

    .floor {
      position: absolute;
      inset: 0 auto auto 0;
      width: 960px;
      height: 650px;
      transform: scale(var(--zoom, 1));
      transform-origin: 0 0;
      border: 10px solid #637071;
      border-radius: 9px;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(100, 78, 54, 0.09) 1px, transparent 1px) 0 0 / 42px 100%,
        linear-gradient(180deg, rgba(100, 78, 54, 0.1) 1px, transparent 1px) 0 0 / 100% 34px,
        linear-gradient(90deg, #e7d0ad, #f7ebd5 52%, #dfbf95);
    }

    .room, .bar, .label, .sofa, .window, .deck {
      position: absolute;
      z-index: 1;
    }

    .room {
      display: grid;
      place-items: center;
      border: 6px solid #778080;
      background: #cbd8d5;
      color: rgba(23, 33, 31, 0.72);
      font-size: 0.72rem;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }

    .fixture.wall {
      background: #607071;
      border-color: #607071;
    }

    .fixture.door {
      background: #f5efe5;
      border-color: #607071;
      height: 18px;
    }

    .edit-mode .fixture {
      outline: 2px dashed rgba(14, 104, 96, 0.38);
      outline-offset: 3px;
    }

    .prep {
      left: 0;
      top: 0;
      width: 310px;
      height: 165px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.44) 25%, transparent 25%) 0 0 / 28px 28px,
        linear-gradient(225deg, rgba(255,255,255,0.44) 25%, transparent 25%) 0 0 / 28px 28px,
        #8fb4b0;
    }

    .storage {
      right: 0;
      top: 0;
      width: 410px;
      height: 140px;
    }

    .bar {
      left: 168px;
      top: 154px;
      width: 330px;
      height: 78px;
      border: 5px solid #5c6868;
      background: linear-gradient(180deg, #526260, #3f4f4f);
      box-shadow: 0 10px 18px rgba(31, 24, 17, 0.22);
    }

    .bar::after {
      content: "";
      position: absolute;
      inset: 18px 60px;
      background: #eef0e9;
    }

    .label {
      right: 132px;
      top: 162px;
      color: #d0a836;
      font-size: 1.16rem;
      font-weight: 950;
      letter-spacing: 0.44em;
    }

    .sofa {
      left: 50px;
      bottom: 112px;
      width: 440px;
      height: 40px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
    }

    .sofa i {
      border-radius: 5px;
      background: var(--seat);
    }

    .window {
      left: 0;
      right: 0;
      bottom: 96px;
      height: 12px;
      background: repeating-linear-gradient(90deg, #fff 0 42px, #b9c6c7 42px 50px);
      border-top: 3px solid #b9c6c7;
      border-bottom: 3px solid #b9c6c7;
    }

    .deck {
      left: -10px;
      right: -10px;
      bottom: -10px;
      height: 106px;
      background:
        linear-gradient(90deg, rgba(113, 77, 44, 0.18) 1px, transparent 1px) 0 0 / 44px 100%,
        linear-gradient(180deg, #d7b58f, #e7c59e);
      border-top: 6px solid #c8b092;
    }

    .table {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--w);
      height: var(--h);
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      z-index: 4;
    }

    .piece {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      transition: transform 140ms ease, filter 140ms ease;
    }

    .table:active .piece {
      transform: scale(0.96);
    }

    .chair {
      position: absolute;
      width: 25%;
      height: 18%;
      border-radius: 4px;
      background: #f7f2ea;
      border: 2px solid rgba(43, 52, 49, 0.16);
      z-index: 1;
    }

    .chair.teal { background: #80b8ad; }
    .chair.pattern { background: repeating-linear-gradient(45deg, #355651 0 5px, #f7f2e9 5px 10px); }
    .chair.top { top: 2%; left: 50%; transform: translateX(-50%); }
    .chair.right { right: 2%; top: 50%; transform: translateY(-50%) rotate(90deg); }
    .chair.bottom { bottom: 2%; left: 50%; transform: translateX(-50%); }
    .chair.left { left: 2%; top: 50%; transform: translateY(-50%) rotate(90deg); }

    .shape {
      width: 66%;
      height: 66%;
      border: 4px solid color-mix(in srgb, var(--status) 58%, #6f5135);
      border-radius: 7px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.32), transparent 42%),
        linear-gradient(180deg, color-mix(in srgb, var(--status) 76%, #e4bf8e), color-mix(in srgb, var(--status) 56%, #7d5434));
      box-shadow: 0 10px 18px rgba(53, 36, 18, 0.24);
      display: grid;
      place-items: center;
      z-index: 2;
    }

    .table.unit .shape {
      border-radius: 5px;
    }

    .table.joined .shape::before {
      content: "";
      position: absolute;
      inset: 10px auto 10px 50%;
      width: 2px;
      background: rgba(255, 250, 242, 0.55);
      transform: translateX(-50%);
      z-index: 1;
    }

    .circle .shape { border-radius: 50%; }
    .banquette .shape { width: 54%; height: 72%; }

    .shape::after {
      content: "";
      width: 44%;
      height: 44%;
      border-radius: 50%;
      background: #f7f3ea;
      border: 2px solid rgba(46, 56, 53, 0.18);
      box-shadow: inset 0 0 0 6px rgba(255,255,255,0.7);
    }

    .badge {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      min-width: 46px;
      border-radius: 999px;
      background: rgba(255, 250, 242, 0.96);
      border: 1px solid rgba(31, 24, 17, 0.12);
      box-shadow: 0 4px 10px rgba(31, 24, 17, 0.16);
      padding: 4px 5px;
      z-index: 4;
      font-size: 0.74rem;
      line-height: 1.02;
      font-weight: 950;
      pointer-events: none;
    }

    .badge small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.58rem;
      font-weight: 950;
    }

    .flag {
      position: absolute;
      left: 50%;
      top: calc(100% - 2px);
      transform: translateX(-50%);
      max-width: 100px;
      min-width: 58px;
      border-radius: 999px;
      padding: 4px 6px;
      background: rgba(255, 250, 242, 0.96);
      border: 1px solid color-mix(in srgb, var(--status) 34%, transparent);
      color: color-mix(in srgb, var(--status) 75%, #17211f);
      box-shadow: 0 5px 12px rgba(31, 24, 17, 0.12);
      font-size: 0.56rem;
      line-height: 1.05;
      font-weight: 950;
      z-index: 5;
      pointer-events: none;
    }

    .alert .shape {
      animation: alertPulse 1.55s infinite;
    }

    .alert .flag { color: var(--red); }

    .selected .shape {
      box-shadow: 0 0 0 8px rgba(14, 104, 96, 0.22), 0 14px 22px rgba(53, 36, 18, 0.28);
    }

    .edit-mode .table .piece {
      filter: saturate(1.08) drop-shadow(0 6px 14px rgba(14, 104, 96, 0.2));
    }

    .edit-mode .table.selected .shape {
      box-shadow: 0 0 0 10px rgba(14, 104, 96, 0.28), 0 14px 22px rgba(53, 36, 18, 0.28);
    }

    @keyframes alertPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(198, 65, 65, 0.14), 0 10px 18px rgba(53, 36, 18, 0.24); }
      50% { box-shadow: 0 0 0 9px rgba(198, 65, 65, 0.22), 0 16px 22px rgba(53, 36, 18, 0.3); }
    }

    .hud {
      position: absolute;
      z-index: 20;
      left: max(8px, env(safe-area-inset-left));
      top: max(8px, env(safe-area-inset-top));
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .mark, .icon {
      border: 1px solid rgba(255,255,255,0.46);
      box-shadow: 0 8px 20px rgba(31, 24, 17, 0.16);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }

    .mark {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(14, 104, 96, 0.94);
      color: #fff;
      font-weight: 950;
      font-size: 0.8rem;
    }

    .icon {
      width: 34px;
      height: 34px;
      border-radius: var(--radius);
      background: rgba(255, 250, 242, 0.88);
      color: var(--ink);
      font-weight: 950;
      border-color: rgba(38, 31, 23, 0.12);
    }

    .icon.active {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }

    .zoom {
      position: absolute;
      z-index: 20;
      right: max(8px, env(safe-area-inset-right));
      top: max(8px, env(safe-area-inset-top));
      display: flex;
      gap: 6px;
    }

    .key {
      position: absolute;
      z-index: 20;
      left: max(8px, env(safe-area-inset-left));
      bottom: max(8px, env(safe-area-inset-bottom));
      display: flex;
      gap: 6px;
      padding: 6px;
      border-radius: var(--radius);
      background: rgba(255, 250, 242, 0.9);
      border: 1px solid rgba(38, 31, 23, 0.12);
      box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }

    .key span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--ink);
      font-size: 0.58rem;
      font-weight: 950;
      white-space: nowrap;
    }

    .key i {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--c);
      border: 2px solid rgba(255,255,255,0.74);
      box-shadow: 0 2px 6px rgba(31, 24, 17, 0.2);
    }

    .editor {
      position: absolute;
      z-index: 30;
      right: max(8px, env(safe-area-inset-right));
      bottom: max(8px, env(safe-area-inset-bottom));
      width: min(420px, calc(100vw - 16px));
      max-height: calc(100dvh - 72px);
      display: none;
      grid-template-rows: 42px 42px minmax(0, 1fr) 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
    }

    .editor.open { display: grid; }

    .editor-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 6px;
      padding: 7px 8px;
      border-bottom: 1px solid var(--line);
    }

    .editor-head h2 {
      margin: 0;
      font-size: 1rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pill {
      height: 24px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 0 8px;
      background: color-mix(in srgb, var(--status) 16%, white);
      color: color-mix(in srgb, var(--status) 76%, #17211f);
      font-size: 0.66rem;
      font-weight: 950;
    }

    .close {
      width: 28px;
      height: 28px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: #fff;
      font-weight: 950;
    }

    .quick {
      display: grid;
      grid-template-columns: 132px minmax(0, 1fr);
      gap: 6px;
      padding: 6px 8px;
      border-bottom: 1px solid var(--line);
    }

    .guest-stepper {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) 30px;
      gap: 5px;
      align-items: center;
    }

    .guest-stepper button {
      height: 30px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      font-weight: 950;
    }

    .guest-count {
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      background: #fff;
      border: 1px solid var(--line);
      font-size: 1rem;
      font-weight: 950;
    }

    input, textarea {
      width: 100%;
      min-width: 0;
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
      padding: 6px 7px;
      outline: none;
      font-size: 0.78rem;
      font-weight: 850;
    }

    textarea {
      resize: none;
      user-select: text;
    }

    .elapsed {
      display: grid;
      place-items: center;
      height: 30px;
      border-radius: var(--radius);
      background: #efe7db;
      text-align: center;
      font-size: 0.62rem;
      line-height: 1.05;
      font-weight: 950;
    }

    .steps {
      min-height: 0;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
      overflow: hidden;
    }

    .step {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fffaf4;
      padding: 5px;
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 5px;
      text-align: left;
      align-content: start;
    }

    .step.done {
      background: #eef8f0;
      border-color: rgba(53, 138, 102, 0.28);
    }

    .tick {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      display: grid;
      place-items: center;
      border: 2px solid rgba(23, 33, 31, 0.22);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 950;
    }

    .done .tick {
      background: var(--brand);
      border-color: var(--brand);
    }

    .step-title {
      display: block;
      min-width: 0;
      font-size: 0.68rem;
      line-height: 1.05;
      font-weight: 950;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .step-time, .step-age {
      display: block;
      margin-top: 3px;
      font-size: 0.56rem;
      line-height: 1;
      font-weight: 950;
    }

    .step-time { color: var(--muted); }
    .step-age { color: var(--brand); }

    .editor-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 0 8px 8px;
    }

    .edit-tools {
      position: absolute;
      z-index: 29;
      right: max(8px, env(safe-area-inset-right));
      bottom: max(8px, env(safe-area-inset-bottom));
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: min(330px, calc(100vw - 16px));
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
    }

    .edit-mode .edit-tools {
      display: grid;
    }

    .btn {
      height: 30px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
      font-size: 0.76rem;
      font-weight: 950;
    }

    .btn.danger {
      color: var(--red);
      background: #fff4ef;
      border-color: rgba(198, 65, 65, 0.22);
    }

    .btn.primary {
      color: #fff;
      background: var(--brand);
      border-color: var(--brand);
    }

    .note {
      position: absolute;
      z-index: 42;
      right: max(8px, env(safe-area-inset-right));
      bottom: max(8px, env(safe-area-inset-bottom));
      width: min(420px, calc(100vw - 16px));
      display: none;
      grid-template-columns: minmax(0, 1fr) 80px;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .note.open { display: grid; }

    [hidden] {
      display: none !important;
    }

    .plan-tools {
      position: absolute;
      z-index: 29;
      left: 50%;
      top: max(8px, env(safe-area-inset-top));
      transform: translateX(-50%);
      display: none;
      grid-template-columns: repeat(5, auto);
      gap: 6px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
    }

    .edit-mode .plan-tools {
      display: grid;
    }

    .install {
      position: fixed;
      inset: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) auto max(8px, env(safe-area-inset-left));
      z-index: 50;
      display: none;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      border: 1px solid rgba(14, 104, 96, 0.22);
      border-radius: var(--radius);
      background: rgba(255, 250, 242, 0.96);
      box-shadow: var(--shadow);
      padding: 9px 10px;
    }

    .install.show { display: grid; }

    .install strong, .install span {
      display: block;
      line-height: 1.2;
    }

    .install strong { font-size: 0.84rem; }
    .install span { margin-top: 2px; color: var(--muted); font-size: 0.72rem; font-weight: 850; }

    @media (max-width: 720px) {
      .editor {
        left: max(8px, env(safe-area-inset-left));
        right: max(8px, env(safe-area-inset-right));
        width: auto;
        max-height: 72dvh;
        grid-template-rows: 40px 40px minmax(0, 1fr) 36px;
      }

      .steps {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 5px;
        padding: 6px;
      }

      .step {
        padding: 5px;
      }

      .key {
        left: max(48px, env(safe-area-inset-left));
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="map-viewport" id="mapViewport">
      <div class="map-scale" id="mapScale">
        <div class="floor" id="floor"></div>
      </div>
    </section>

    <div class="hud">
      <div class="mark">PH</div>
      <button class="icon" id="undoBtn" type="button">↶</button>
      <button class="icon" id="demoBtn" type="button">↺</button>
      <button class="icon" id="addBtn" type="button">+</button>
      <button class="icon" id="editBtn" type="button">✎</button>
    </div>

    <div class="zoom">
      <button class="icon" id="zoomOut" type="button">−</button>
      <button class="icon" id="fitMap" type="button">Fit</button>
      <button class="icon" id="zoomIn" type="button">+</button>
    </div>

    <div class="key" aria-label="Status key">
      <span><i style="--c:#d8d0c3"></i>Empty</span>
      <span><i style="--c:#547c92"></i>Sat</span>
      <span><i style="--c:#4f9fc7"></i>Water</span>
      <span><i style="--c:#bd7a42"></i>Food</span>
      <span><i style="--c:#398767"></i>Eating</span>
      <span><i style="--c:#89a85c"></i>Bill</span>
      <span><i style="--c:#1f6f4d"></i>Paid</span>
      <span><i style="--c:#c64b43"></i>!</span>
    </div>

    <aside class="editor" id="editor"></aside>
    <div class="plan-tools" id="planTools">
      <button class="btn" data-add-fixture="wall" type="button">Wall</button>
      <button class="btn" data-add-fixture="door" type="button">Door</button>
      <button class="btn" data-add-fixture="bar" type="button">Bar</button>
      <button class="btn" data-add-fixture="pass" type="button">Pass</button>
      <button class="btn" id="savePlanBtn" type="button">Save</button>
    </div>
    <div class="edit-tools" id="editTools">
      <button class="btn" id="splitBtn" type="button">Split</button>
      <button class="btn" id="joinBtn" type="button">Join</button>
      <button class="btn" id="rotateBtn" type="button">Rotate</button>
      <button class="btn primary" id="doneEditBtn" type="button">Done</button>
    </div>

    <form class="note" id="noteForm" hidden>
      <textarea id="noteText" placeholder="Note"></textarea>
      <button class="btn primary" id="noteSave" type="button" onclick="saveCurrentNote()">Save</button>
    </form>
  </main>

  <div class="install" id="installPrompt">
    <div>
      <strong>Use full screen</strong>
      <span>Tap Share, then Add to Home Screen. Open Perfect Host from the icon.</span>
    </div>
    <button class="btn primary" id="dismissInstall" type="button">OK</button>
  </div>

  <script>
    const STORAGE_KEY = "perfect-host-v9";
    const UNDO_LIMIT = 50;
    const statuses = {
      empty: { label: "Empty", color: "#d8d0c3" },
      seated: { label: "Sat", color: "#547c92" },
      water: { label: "Water due", color: "#4f9fc7" },
      drinks: { label: "Drinks in", color: "#6f8fa3" },
      food: { label: "Food ordered", color: "#bd7a42" },
      foodArrived: { label: "Food arrived", color: "#d09b4b" },
      eating: { label: "Eating", color: "#398767" },
      attention: { label: "Attention!", color: "#c64b43" },
      bill: { label: "Bill requested", color: "#89a85c" },
      paid: { label: "Bill paid", color: "#1f6f4d" },
      left: { label: "Reset", color: "#777873" }
    };

    const steps = [
      ["water", "Water"],
      ["drinks", "Drinks ordered"],
      ["drinksArrived", "Drinks arrived"],
      ["food", "Food ordered"],
      ["foodArrived", "Food arrived"],
      ["checkBack", "Check"],
      ["clearDessert", "Clear"],
      ["moreDrinksBill", "Bill"],
      ["billPaid", "Paid"]
    ];

    const layouts = [
      { x: 100, y: 360, w: 78, h: 78, shape: "unit banquette", chair: "pattern" },
      { x: 220, y: 360, w: 78, h: 78, shape: "unit banquette", chair: "pattern" },
      { x: 340, y: 360, w: 78, h: 78, shape: "unit banquette", chair: "pattern" },
      { x: 630, y: 250, w: 78, h: 78, shape: "unit joined", chair: "teal" },
      { x: 708, y: 250, w: 78, h: 78, shape: "unit joined", chair: "teal" },
      { x: 630, y: 398, w: 78, h: 78, shape: "unit joined", chair: "teal" },
      { x: 708, y: 398, w: 78, h: 78, shape: "unit joined", chair: "teal" },
      { x: 816, y: 520, w: 76, h: 76, shape: "circle", chair: "teal" },
      { x: 105, y: 526, w: 76, h: 76, shape: "circle", chair: "" },
      { x: 250, y: 526, w: 76, h: 76, shape: "circle", chair: "" },
      { x: 395, y: 526, w: 76, h: 76, shape: "circle", chair: "" },
      { x: 665, y: 524, w: 76, h: 76, shape: "circle", chair: "teal" }
    ];

    const now = Date.now();
    const minutesAgo = (m) => new Date(now - m * 60000).toISOString();
    let zoom = 1;
    let undoStack = [];

    function blankSteps(overrides = {}) {
      const base = {};
      steps.forEach(([key]) => base[key] = { done: false, time: "", note: "" });
      return { ...base, ...overrides };
    }

    function makeTable(id, name, guests = 0, seatedAt = "", stepOverrides = {}, extras = {}) {
      return {
        id, name, guests, seatedAt,
        attention: false,
        attentionNote: "",
        moment: "",
        leftTime: "",
        layout: null,
        steps: blankSteps(stepOverrides),
        ...extras
      };
    }

    const demoTables = [
      makeTable("1", "Window 1", 2, minutesAgo(18), {
        water: { done: true, time: minutesAgo(16), note: "Still water, lime." },
        drinks: { done: true, time: minutesAgo(12), note: "Two Picpoul." },
        drinksArrived: { done: true, time: minutesAgo(8), note: "" }
      }),
      makeTable("2", "Terrace 2", 4, minutesAgo(42), {
        water: { done: true, time: minutesAgo(39), note: "" },
        drinks: { done: true, time: minutesAgo(36), note: "One AF beer." },
        drinksArrived: { done: true, time: minutesAgo(31), note: "" },
        food: { done: true, time: minutesAgo(32), note: "" }
      }),
      makeTable("3", "Bar 3", 0, "", {}),
      makeTable("4", "Booth 4", 5, minutesAgo(13), {}, { attention: true, attentionNote: "High chair." }),
      makeTable("5", "Sea 5", 3, minutesAgo(67), {
        water: { done: true, time: minutesAgo(65), note: "" },
        drinks: { done: true, time: minutesAgo(62), note: "" },
        drinksArrived: { done: true, time: minutesAgo(58), note: "" },
        food: { done: true, time: minutesAgo(54), note: "Dairy allergy." },
        foodArrived: { done: true, time: minutesAgo(30), note: "" },
        checkBack: { done: true, time: minutesAgo(24), note: "Happy." },
        clearDessert: { done: true, time: minutesAgo(8), note: "Birthday brownie." }
      }, { moment: "Birthday: Sophie. Picpoul." }),
      makeTable("6", "Deck 6", 2, minutesAgo(35), {
        water: { done: true, time: minutesAgo(33), note: "" },
        drinks: { done: true, time: minutesAgo(30), note: "" },
        drinksArrived: { done: true, time: minutesAgo(27), note: "" },
        food: { done: true, time: minutesAgo(31), note: "Chase kitchen." }
      }),
      makeTable("7", "Lounge 7", 2, minutesAgo(92), {
        water: { done: true, time: minutesAgo(90), note: "" },
        drinks: { done: true, time: minutesAgo(86), note: "" },
        drinksArrived: { done: true, time: minutesAgo(82), note: "" },
        food: { done: true, time: minutesAgo(76), note: "" },
        foodArrived: { done: true, time: minutesAgo(48), note: "" },
        checkBack: { done: true, time: minutesAgo(42), note: "" },
        clearDessert: { done: true, time: minutesAgo(16), note: "" },
        moreDrinksBill: { done: true, time: minutesAgo(3), note: "Bill requested." }
      }),
      makeTable("8", "Garden 8", 0, "", {}, { leftTime: minutesAgo(6) })
    ];

    let state = load();
    let editMode = false;
    let dragging = null;
    const floor = document.getElementById("floor");
    const editor = document.getElementById("editor");
    const mapViewport = document.getElementById("mapViewport");
    const mapScale = document.getElementById("mapScale");
    const noteForm = document.getElementById("noteForm");
    const noteText = document.getElementById("noteText");
    const installPrompt = document.getElementById("installPrompt");

    function load() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved?.tables?.length) return normalizeState(saved);
      } catch {}
      return normalizeState({ selectedId: "", tables: demoTables, fixtures: defaultFixtures() });
    }

    function defaultFixtures() {
      return [
        { id: "prep", type: "prep", x: 0, y: 0, w: 310, h: 165, r: 0 },
        { id: "storage", type: "storage", x: 540, y: 0, w: 410, h: 140, r: 0 },
        { id: "bar", type: "bar", x: 168, y: 154, w: 330, h: 78, r: 0 },
        { id: "pass", type: "pass", x: 612, y: 162, w: 210, h: 28, r: 0 },
        { id: "sofa", type: "sofa", x: 50, y: 492, w: 440, h: 40, r: 0 },
        { id: "window", type: "window", x: 0, y: 544, w: 960, h: 12, r: 0 },
        { id: "deck", type: "deck", x: -10, y: 554, w: 980, h: 106, r: 0 }
      ];
    }

    function normalizeState(value) {
      value.fixtures ||= defaultFixtures();
      value.tables.forEach((table, index) => {
        table.steps = blankSteps(table.steps || {});
        table.layout ||= { ...layouts[index % layouts.length] };
      });
      return value;
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      document.getElementById("undoBtn").disabled = undoStack.length === 0;
    }

    function mutate(fn) {
      undoStack.push(JSON.stringify(state));
      if (undoStack.length > UNDO_LIMIT) undoStack.shift();
      fn();
      save();
      render();
    }

    function selected() {
      return state.tables.find(t => t.id === state.selectedId);
    }

    function minsSince(value) {
      if (!value) return 0;
      return Math.max(0, Math.floor((Date.now() - new Date(value).getTime()) / 60000));
    }

    function minsBetween(start, end = new Date().toISOString()) {
      if (!start || !end) return 0;
      return Math.max(0, Math.floor((new Date(end).getTime() - new Date(start).getTime()) / 60000));
    }

    function elapsed(value) {
      if (!value) return "-";
      const mins = minsSince(value);
      if (mins < 60) return `${mins}m`;
      return `${Math.floor(mins / 60)}h ${mins % 60}m`;
    }

    function precise(value) {
      if (!value) return "";
      return preciseBetween(value);
    }

    function preciseBetween(start, end = new Date().toISOString()) {
      if (!start || !end) return "";
      const total = Math.max(0, Math.floor((new Date(end).getTime() - new Date(start).getTime()) / 1000));
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      return h ? `${h}h ${m}m ${s}s` : `${m}m ${s}s`;
    }

    function time(value) {
      if (!value) return "-";
      return new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit" }).format(new Date(value));
    }

    function dateValue(value) {
      if (!value) return "";
      const d = new Date(value);
      return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    }

    function fromDate(value) {
      return value ? new Date(value).toISOString() : "";
    }

    function alerts(table) {
      if (!table.guests || table.leftTime) return [];
      const out = [];
      const seated = minsSince(table.seatedAt);
      if (!table.steps.drinks.done && seated >= 10) out.push("Drinks");
      if (table.steps.drinks.done && !table.steps.drinksArrived.done && minsBetween(table.steps.drinks.time) >= 10) out.push("Drinks");
      if (table.steps.food.done && !table.steps.foodArrived.done && minsSince(table.steps.food.time) >= 30) out.push("Food");
      if (table.steps.foodArrived.done && !table.steps.checkBack.done && minsSince(table.steps.foodArrived.time) >= 8) out.push("Check");
      if (seated >= 90) out.push("Long");
      if (table.attention) out.push("!");
      return out;
    }

    function statusKey(table) {
      if (table.attention) return "attention";
      if (table.leftTime) return "left";
      if (!table.guests) return "empty";
      if (!table.steps.water.done) return "water";
      if (table.steps.billPaid.done) return "paid";
      if (table.steps.moreDrinksBill.done) return "bill";
      if (table.steps.checkBack.done || table.steps.clearDessert.done) return "eating";
      if (table.steps.foodArrived.done) return "foodArrived";
      if (table.steps.food.done) return "food";
      if (table.steps.drinksArrived.done || table.steps.drinks.done) return "drinks";
      return "seated";
    }

    function shortName(name) {
      const n = name.match(/\d+/)?.[0];
      return n ? `T${n}` : name.split(" ").map(p => p[0]).join("").slice(0, 3).toUpperCase();
    }

    function firstNote(table) {
      if (table.attentionNote) return table.attentionNote;
      if (table.moment) return table.moment;
      for (const [key] of steps) if (table.steps[key]?.note) return table.steps[key].note;
      return "";
    }

    function tableDefaultGuests(table) {
      const layout = getLayout(table);
      if (layout.w >= 140 || layout.h >= 140 || String(layout.shape || "").includes("joined")) return 2;
      return 1;
    }

    function renderFloor() {
      const fixtures = (state.fixtures || []).map(renderFixture).join("");
      const tables = state.tables.map((table, index) => {
        const layout = table.layout || layouts[index % layouts.length];
        const s = statuses[statusKey(table)];
        const tableAlerts = alerts(table);
        const chair = layout.chair ? ` ${layout.chair}` : "";
        return `
          <button class="table ${layout.shape || "unit"} ${table.id === state.selectedId ? "selected" : ""} ${tableAlerts.length ? "alert" : ""}"
            data-id="${table.id}" type="button"
            style="--x:${layout.x}px;--y:${layout.y}px;--w:${layout.w}px;--h:${layout.h}px;--status:${s.color}"
            aria-label="${table.name}">
            <span class="piece">
              <i class="chair top${chair}"></i><i class="chair right${chair}"></i><i class="chair bottom${chair}"></i><i class="chair left${chair}"></i>
              <span class="shape"></span>
              <span class="badge">${shortName(table.name)}<small>${table.guests ? `${table.guests}p · ${elapsed(table.seatedAt)}` : "Empty"}</small></span>
              <span class="flag">${tableAlerts[0] || s.label}</span>
            </span>
          </button>
        `;
      }).join("");

      floor.innerHTML = `
        ${fixtures}
        ${tables}
      `;
    }

    function renderFixture(item) {
      const style = `left:${item.x}px;top:${item.y}px;width:${item.w}px;height:${item.h}px;transform:rotate(${item.r || 0}deg)`;
      if (item.type === "prep") return `<div class="room prep fixture" data-fixture="${item.id}" style="${style}"></div>`;
      if (item.type === "storage") return `<div class="room storage fixture" data-fixture="${item.id}" style="${style}"></div>`;
      if (item.type === "bar") return `<div class="bar fixture" data-fixture="${item.id}" style="${style}"></div>`;
      if (item.type === "pass") return `<div class="label fixture" data-fixture="${item.id}" style="${style}">PASS</div>`;
      if (item.type === "sofa") return `<div class="sofa fixture" data-fixture="${item.id}" style="${style}"><i style="--seat:#cbd4bd"></i><i style="--seat:#a8bbb6"></i><i style="--seat:#089199"></i><i style="--seat:#c7ceb8"></i><i style="--seat:#afbfbc"></i><i style="--seat:#089199"></i></div>`;
      if (item.type === "window") return `<div class="window fixture" data-fixture="${item.id}" style="${style}"></div>`;
      if (item.type === "deck") return `<div class="deck fixture" data-fixture="${item.id}" style="${style}"></div>`;
      if (item.type === "door") return `<div class="window fixture door" data-fixture="${item.id}" style="${style}"></div>`;
      if (item.type === "wall") return `<div class="room fixture wall" data-fixture="${item.id}" style="${style}"></div>`;
      return "";
    }

    function renderEditor() {
      const table = selected();
      if (!table || editMode) {
        editor.classList.remove("open");
        return;
      }
      const s = statuses[statusKey(table)];
      editor.classList.add("open");
      editor.innerHTML = `
        <div class="editor-head">
          <h2>${table.name}</h2>
          <span class="pill" style="--status:${s.color}">${s.label}</span>
          <button class="close" id="closeEditor" type="button">×</button>
        </div>
        <div class="quick">
          <div class="guest-stepper">
            <button data-guests="-1" type="button">−</button>
            <div class="guest-count">${table.guests || 0}</div>
            <button data-guests="1" type="button">+</button>
          </div>
          <div class="elapsed">Sat ${time(table.seatedAt)}<br>${precise(table.seatedAt) || "-"}</div>
        </div>
        <div class="steps">
          ${steps.map(([key, label]) => renderStep(table, key, label)).join("")}
        </div>
        <div class="editor-actions">
          <button class="btn" data-left type="button">${table.leftTime ? "Reopen" : "Left"}</button>
          <button class="btn ${table.attention ? "danger" : ""}" data-attention type="button">Attention!</button>
          <button class="btn" data-note type="button">Note</button>
          <button class="btn danger" data-reset type="button">Reset</button>
        </div>
      `;
    }

    function renderStep(table, key, label) {
      const step = table.steps[key];
      return `
        <button class="step ${step.done ? "done" : ""}" data-step="${key}" type="button">
          <span class="tick">${step.done ? "✓" : ""}</span>
          <span>
            <span class="step-title">${label}</span>
            <span class="step-time">${step.done ? time(step.time) : "Not set"}</span>
            <span class="step-age">${step.done ? stepDuration(table, key) : ""}</span>
          </span>
        </button>
      `;
    }

    function stepDuration(table, key) {
      if (key === "drinks" && table.steps.drinksArrived.done) return preciseBetween(table.steps.drinks.time, table.steps.drinksArrived.time);
      if (key === "food" && table.steps.foodArrived.done) return preciseBetween(table.steps.food.time, table.steps.foodArrived.time);
      return precise(table.steps[key].time);
    }

    function render() {
      renderFloor();
      renderEditor();
      applyZoom();
      document.getElementById("undoBtn").disabled = undoStack.length === 0;
      document.body.classList.toggle("edit-mode", editMode);
      document.getElementById("editBtn").classList.toggle("active", editMode);
    }

    function applyZoom() {
      mapScale.style.setProperty("--zoom", zoom);
      floor.style.setProperty("--zoom", zoom);
      const rect = mapViewport.getBoundingClientRect();
      mapScale.style.setProperty("--map-x", `${Math.max(0, (rect.width - 960 * zoom) / 2)}px`);
      mapScale.style.setProperty("--map-y", `${Math.max(0, (rect.height - 650 * zoom) / 2)}px`);
    }

    function fitZoom() {
      const rect = mapViewport.getBoundingClientRect();
      zoom = Math.max(0.32, Math.min(1.35, Math.min(rect.width / 960, rect.height / 650)));
      applyZoom();
      mapViewport.scrollLeft = Math.max(0, (960 * zoom + Math.max(0, (rect.width - 960 * zoom) / 2) * 2 - rect.width) / 2);
      mapViewport.scrollTop = Math.max(0, (650 * zoom + Math.max(0, (rect.height - 650 * zoom) / 2) * 2 - rect.height) / 2);
    }

    floor.addEventListener("pointerdown", (event) => {
      if (!editMode) return;
      const button = event.target.closest(".table");
      const fixtureEl = event.target.closest(".fixture");
      if (!button && !fixtureEl) return;
      const targetType = button ? "table" : "fixture";
      const record = button
        ? state.tables.find(t => t.id === button.dataset.id)
        : state.fixtures.find(f => f.id === fixtureEl.dataset.fixture);
      if (!record) return;
      const layout = button ? getLayout(record) : record;
      if (button) state.selectedId = record.id;
      dragging = {
        id: record.id,
        type: targetType,
        snapshot: JSON.stringify(state),
        startX: event.clientX,
        startY: event.clientY,
        x: layout.x,
        y: layout.y,
        moved: false
      };
      (button || fixtureEl).setPointerCapture?.(event.pointerId);
      event.preventDefault();
      render();
    });

    floor.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      const record = dragging.type === "table"
        ? state.tables.find(t => t.id === dragging.id)
        : state.fixtures.find(f => f.id === dragging.id);
      if (!record) return;
      const layout = dragging.type === "table" ? getLayout(record) : record;
      const dx = (event.clientX - dragging.startX) / zoom;
      const dy = (event.clientY - dragging.startY) / zoom;
      if (Math.abs(dx) + Math.abs(dy) > 2) dragging.moved = true;
      layout.x = Math.max(0, Math.min(900, Math.round(dragging.x + dx)));
      layout.y = Math.max(0, Math.min(590, Math.round(dragging.y + dy)));
      if (dragging.type === "table") record.layout = layout;
      renderFloor();
      applyZoom();
    });

    floor.addEventListener("pointerup", () => {
      if (!dragging) return;
      if (dragging.moved) {
        undoStack.push(dragging.snapshot);
        if (undoStack.length > UNDO_LIMIT) undoStack.shift();
        save();
      }
      dragging = null;
    });

    function getLayout(table) {
      if (!table.layout) {
        const index = state.tables.findIndex(t => t.id === table.id);
        table.layout = { ...layouts[index % layouts.length] };
      }
      return table.layout;
    }

    floor.addEventListener("click", (event) => {
      const button = event.target.closest(".table");
      if (!button) return;
      state.selectedId = button.dataset.id;
      save();
      render();
    });

    editor.addEventListener("click", (event) => {
      const table = selected();
      if (!table) return;
      const stepButton = event.target.closest("[data-step]");
      if (stepButton) {
        mutate(() => {
          const step = table.steps[stepButton.dataset.step];
          step.done = !step.done;
          step.time = step.done ? (step.time || new Date().toISOString()) : "";
          if (stepButton.dataset.step === "drinksArrived" && step.done && !table.steps.drinks.done) {
            table.steps.drinks.done = true;
            table.steps.drinks.time = table.steps.drinks.time || step.time;
          }
          if (stepButton.dataset.step === "foodArrived" && step.done && !table.steps.food.done) {
            table.steps.food.done = true;
            table.steps.food.time = table.steps.food.time || step.time;
          }
        });
      }
      if (event.target.id === "closeEditor") {
        state.selectedId = "";
        save();
        render();
      }
      if (event.target.matches("[data-attention]")) mutate(() => table.attention = !table.attention);
      if (event.target.matches("[data-left]")) mutate(() => table.leftTime = table.leftTime ? "" : new Date().toISOString());
      if (event.target.matches("[data-guests]")) {
        const delta = Number(event.target.dataset.guests);
        mutate(() => {
          if ((table.guests || 0) === 0 && delta > 0) {
            table.guests = tableDefaultGuests(table);
          } else {
            table.guests = Math.max(0, Math.min(30, (table.guests || 0) + delta));
          }
          if (table.guests > 0 && !table.seatedAt) table.seatedAt = new Date().toISOString();
          if (table.guests === 0) table.seatedAt = "";
        });
      }
      if (event.target.matches("[data-note]")) {
        noteText.value = table.moment || table.attentionNote || firstNote(table);
        noteForm.hidden = false;
        noteForm.classList.add("open");
        noteText.focus();
      }
      if (event.target.matches("[data-reset]") && confirm(`Reset ${table.name}?`)) {
        mutate(() => {
          const layout = table.layout;
          const index = state.tables.findIndex(t => t.id === table.id);
          state.tables[index] = makeTable(table.id, table.name, 0, "", {}, { layout });
        });
      }
    });

    function saveCurrentNote() {
      const table = selected();
      if (!table) return;
      noteForm.classList.remove("open");
      noteForm.hidden = true;
      mutate(() => table.moment = noteText.value.trim());
    }

    noteForm.addEventListener("submit", (event) => {
      event.preventDefault();
      saveCurrentNote();
    });

    document.getElementById("noteSave").addEventListener("click", saveCurrentNote);

    document.getElementById("undoBtn").addEventListener("click", () => {
      const previous = undoStack.pop();
      if (!previous) return;
      state = JSON.parse(previous);
      save();
      render();
    });

    document.getElementById("demoBtn").addEventListener("click", () => {
      if (!confirm("Reset demo data?")) return;
      mutate(() => state = { selectedId: "", tables: demoTables });
      setTimeout(fitZoom, 0);
    });

    document.getElementById("addBtn").addEventListener("click", () => {
      const name = prompt("Table name", `Table ${state.tables.length + 1}`);
      if (!name?.trim()) return;
      mutate(() => {
        const id = String(Date.now());
        const layout = { ...layouts[state.tables.length % layouts.length], shape: "unit", w: 78, h: 78 };
        state.tables.push(makeTable(id, name.trim(), 0, "", {}, { layout }));
        state.selectedId = id;
      });
    });

    document.getElementById("editBtn").addEventListener("click", () => {
      editMode = !editMode;
      render();
    });

    document.getElementById("doneEditBtn").addEventListener("click", () => {
      editMode = false;
      save();
      render();
    });

    document.getElementById("savePlanBtn").addEventListener("click", () => {
      save();
      document.getElementById("savePlanBtn").textContent = "Saved";
      setTimeout(() => { document.getElementById("savePlanBtn").textContent = "Save"; }, 900);
    });

    document.querySelectorAll("[data-add-fixture]").forEach((button) => {
      button.addEventListener("click", () => {
        const type = button.dataset.addFixture;
        mutate(() => {
          const id = `${type}-${Date.now()}`;
          const defaults = {
            wall: { w: 180, h: 18 },
            door: { w: 90, h: 18 },
            bar: { w: 180, h: 56 },
            pass: { w: 120, h: 28 }
          }[type];
          state.fixtures.push({ id, type, x: 420, y: 260, r: 0, ...defaults });
        });
      });
    });

    document.getElementById("splitBtn").addEventListener("click", () => {
      const table = selected();
      if (!table) return;
      mutate(() => {
        const layout = getLayout(table);
        const wasJoined = layout.w > 90;
        layout.shape = "unit";
        layout.w = 78;
        layout.h = 78;
        table.layout = layout;
        if (wasJoined) {
          const id = String(Date.now());
          const nextLayout = { ...layout, x: Math.min(882, layout.x + 84), y: layout.y };
          state.tables.push(makeTable(id, `${table.name}B`, 0, "", {}, { layout: nextLayout }));
          state.selectedId = id;
        }
      });
    });

    document.getElementById("joinBtn").addEventListener("click", () => {
      const table = selected();
      if (!table) return;
      mutate(() => {
        const layout = getLayout(table);
        layout.shape = "unit joined";
        layout.w = 156;
        layout.h = 78;
        table.layout = layout;
      });
    });

    document.getElementById("rotateBtn").addEventListener("click", () => {
      const table = selected();
      if (!table) return;
      mutate(() => {
        const layout = getLayout(table);
        [layout.w, layout.h] = [layout.h, layout.w];
        layout.r = ((layout.r || 0) + 90) % 180;
        table.layout = layout;
      });
    });

    document.getElementById("zoomIn").addEventListener("click", () => { zoom = Math.min(1.5, +(zoom + 0.1).toFixed(2)); applyZoom(); });
    document.getElementById("zoomOut").addEventListener("click", () => { zoom = Math.max(0.32, +(zoom - 0.1).toFixed(2)); applyZoom(); });
    document.getElementById("fitMap").addEventListener("click", fitZoom);
    window.addEventListener("resize", () => setTimeout(fitZoom, 80));

    function isStandalone() {
      return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    }

    function isIosSafari() {
      const ua = navigator.userAgent;
      return /iPad|iPhone|iPod/.test(ua) && /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua);
    }

    function maybeShowInstallPrompt() {
      if (!isIosSafari() || isStandalone() || localStorage.getItem("perfect-host-install-dismissed") === "1") return;
      installPrompt.classList.add("show");
    }

    document.getElementById("dismissInstall").addEventListener("click", () => {
      localStorage.setItem("perfect-host-install-dismissed", "1");
      installPrompt.classList.remove("show");
    });

    save();
    render();
    setTimeout(fitZoom, 60);
    setTimeout(maybeShowInstallPrompt, 300);
    function tickTimers() {
      const table = selected();
      if (table && !editMode && editor.classList.contains("open")) {
        const elapsedNode = editor.querySelector(".elapsed");
        if (elapsedNode) elapsedNode.innerHTML = `Sat ${time(table.seatedAt)}<br>${precise(table.seatedAt) || "-"}`;
        editor.querySelectorAll("[data-step]").forEach((node) => {
          const key = node.dataset.step;
          const age = node.querySelector(".step-age");
          if (age && table.steps[key]?.done) age.textContent = stepDuration(table, key);
        });
      }
      floor.querySelectorAll(".table").forEach((node) => {
        const table = state.tables.find(t => t.id === node.dataset.id);
        const small = node.querySelector(".badge small");
        if (table && small) small.textContent = table.guests ? `${table.guests}p - ${elapsed(table.seatedAt)}` : "Empty";
      });
    }

    setInterval(tickTimers, 1000);
  </script>
</body>
</html>
